name: check_release

on:
  workflow_dispatch:
  schedule:
  - cron: 0 0 * * *

jobs:
  check_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Trigger build of missing releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tags() {
          gh api --paginate "repos/$1/tags" --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+$'
        }
        tags verilator/verilator > upstream.txt
        tags "$GITHUB_REPOSITORY" > current.txt
        latest=$(sort -V current.txt | tail -1)
        echo "The latest version of verilator-package is $latest"
        for tag in $(grep -vxF -f current.txt upstream.txt); do
          # Tags older than ours predate this repository and are not republished
          if [ "$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -1)" != "$tag" ]; then
            continue
          fi
          echo "Triggering build of $tag"
          gh workflow run build.yml -f tag="$tag"
        done
    - name: Keep the schedule trigger alive
      # GitHub disables a scheduled workflow after 60 days without repository activity
      run: |
        age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
        if [ "$age" -ge 45 ]; then
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'Keep the scheduled workflow alive'
          git push origin "HEAD:$GITHUB_REF_NAME"
        fi
