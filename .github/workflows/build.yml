name: build

on:
  push:
    tags:
      - 'v*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Verilator tag to build (e.g. v5.048)'
        required: true
        type: string
      image:
        description: 'Build only this runner image (e.g. ubuntu-26.04); all if empty'
        required: false
        type: string

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.select.outputs.os }}
    steps:
    - name: Select images
      id: select
      env:
        IMAGE: ${{ inputs.image }}
        OS: |
          [
            { "image": "ubuntu-26.04", "name": "linux" },
            { "image": "ubuntu-24.04", "name": "linux" },
            { "image": "ubuntu-22.04", "name": "linux" },
            { "image": "macos-15",     "name": "osx" }
          ]
      run: |
        os=$(jq -c --arg image "$IMAGE" 'map(select($image == "" or .image == $image))' <<< "$OS")
        if [ "$os" = "[]" ]; then
          echo "Unknown image: $IMAGE" >&2
          exit 1
        fi
        echo "os=$os" >> "$GITHUB_OUTPUT"
  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix.outputs.os) }}
    runs-on: ${{ matrix.os.image }}
    env:
      CI_BUILD_STAGE_NAME: build
      CI_OS_NAME: ${{ matrix.os.name }}
      CI_RUNS_ON: ${{ matrix.os.image }}
    permissions:
      contents: write
    steps:
    - name: Setup variables
      id: variables
      run: |
        if [ -n "${{ inputs.tag }}" ]; then
          echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
        else
          echo "tag=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
        fi
    - name: Checkout
      uses: actions/checkout@v4
      with:
        repository: 'verilator/verilator'
        ref: ${{ steps.variables.outputs.tag }}
    - name: Install packages for build
      run: |
        # v5.052 replaced the environment-driven interface with a stage argument
        if [ -f ./ci/ci-common.bash ]; then
          ./ci/ci-install.bash build
        else
          # The older script installs no macOS build tools
          if [ "$CI_OS_NAME" = osx ]; then
            brew install autoconf bison flex help2man
          fi
          ./ci/ci-install.bash
        fi
    - name: Build
      run: |
        # configure records the mold and ccache it finds into verilated.mk,
        # which would make them a requirement wherever the archive is used
        if command -v mold > /dev/null; then
          sudo apt-get remove --yes mold
        fi
        autoconf
        # An empty prefix keeps the archive relocatable
        ./configure --prefix= ac_cv_prog_OBJCACHE=
        make -j $(nproc 2>/dev/null || sysctl -n hw.logicalcpu)
    - name: Package
      run: |
        mkdir dist
        cp LICENSE dist
        cp README.rst dist
        cp -r bin dist
        cp -r include dist
        cp *.cmake dist
        rm dist/bin/verilator_bin_dbg
        pushd dist
        zip -r ../verilator-${{ matrix.os.image }}.zip .
        popd
    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: "*.zip"
        tag_name: ${{ steps.variables.outputs.tag }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
